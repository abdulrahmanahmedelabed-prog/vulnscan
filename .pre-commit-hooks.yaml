# Kashif as a pre-commit hook (https://pre-commit.com). The whole repository is scanned, so cross-file data flow
# stays complete, but only findings on lines staged for this commit are reported (--diff-staged), and the commit
# is blocked on high or critical ones. Offline: no OSV.dev query, no external tools.
#
#   repos:
#     - repo: https://github.com/abdulrahmanahmedelabed-prog/vulnscan
#       rev: <tag or commit SHA>
#       hooks:
#         - id: kashif
- id: kashif
  name: Kashif SAST (staged changes)
  description: Report security findings introduced by the staged changes; block the commit on high or critical.
  entry: vulnscan
  language: python
  args: [".", "--diff-staged", "--fail-on", "high", "--no-deps", "--no-external", "--no-color", "--lang", "en"]
  pass_filenames: false
  always_run: true
  require_serial: true
  stages: [pre-commit]
  minimum_pre_commit_version: "3.2.0"
