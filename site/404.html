<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Kashif</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/vulnscan/favicon.svg">
<style>
:root{color-scheme:dark light;--bg:#070b14;--panel:#0e1524;--line:#2a3956;--text:#e8eef6;--muted:#a3b1c4;--accent:#67e8f9;--btn:#22d3ee;--btn-fg:#03141a}
@media (prefers-color-scheme: light){:root{--bg:#fff;--panel:#f5f7fb;--line:#d0d8e4;--text:#0b1220;--muted:#3f4a5c;--accent:#0e7490;--btn:#0e7490;--btn-fg:#fff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"IBM Plex Sans Arabic",Tahoma,sans-serif;padding:24px}
main{max-width:520px;text-align:center}
img{width:64px;height:64px}
h1{font-size:30px;margin:18px 0 8px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 22px}
.ar{direction:rtl;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.ar h2{font-size:22px;margin:0 0 6px}
a.btn{display:inline-block;padding:11px 18px;border-radius:11px;background:var(--btn);color:var(--btn-fg);font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
code{color:var(--accent)}
</style>
</head>
<body>
<main>
  <img src="/vulnscan/logo.svg" alt="" width="64" height="64">
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist or has moved.</p>
  <a class="btn" href="/vulnscan/">Go to the Kashif home page</a>
  <section class="ar" lang="ar">
    <h2>الصفحة غير موجودة</h2>
    <p>الصفحة التي تبحث عنها غير موجودة أو نُقلت.</p>
    <a class="btn" href="/vulnscan/?lang=ar">العودة إلى صفحة كاشِف الرئيسية</a>
  </section>
</main>
</body>
</html>
