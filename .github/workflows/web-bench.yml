name: Web accuracy bench

# Passive web corpus gate (spec §5.2–§5.5): every case is served on 127.0.0.1 by bench/web/corpus.py; Kashif scans it
# through its CLI and score.py gates the result on bench/web/min-score.json. The nightly ZAP job runs ZAP 2.17.0's
# passive scanner (no active scan, no spider) on the same corpus for the comparison table.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "bench/web/**"
      - "vulnscan/webscan/**"
      - "vulnscan/web.py"
      - "tests/web/test_corpus_gate.py"

permissions:
  contents: read

jobs:
  corpus:
    name: corpus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      KASHIF_CORPUS_SLOW: "1"          # also run the slow C-HOSTILE drip case
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e .[dev]
      - name: Labels are generated from corpus.py
        run: python bench/web/corpus.py --check-labels
      - name: Harness tests
        run: python -m pytest -q tests/web/test_corpus_gate.py -k "not full_corpus_gate"
      - name: Run the corpus through the CLI
        run: python bench/web/run_kashif.py -o web-results.json --keep web-raw
      - name: Score and gate (min-score.json)
        run: >-
          python bench/web/score.py web-results.json --min-score bench/web/min-score.json
          --baseline bench/web/results/1.0.2-legacy.json --markdown web-score.md --json web-score.json
      - name: Score report in the job summary
        if: always()
        shell: bash
        run: test -f web-score.md && cat web-score.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-bench-${{ matrix.os }}
          path: |
            web-results.json
            web-score.md
            web-score.json
            web-raw/
          if-no-files-found: ignore

  zap:
    # Nightly / on demand only: downloads ZAP (checksum-pinned) and runs its passive rules on the corpus.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ZAP_ZIP_SHA256: 94c8f767b1c2e94f0db66b3ae56514d5e3f5a728ee1b6c798e0c8fe2d61fbff0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Download ZAP 2.17.0 (cross-platform zip, Java 21 from the runner image)
        run: |
          curl -sSLo zap.zip https://github.com/zaproxy/zaproxy/releases/download/v2.17.0/ZAP_2.17.0_Crossplatform.zip
          echo "${ZAP_ZIP_SHA256}  zap.zip" | sha256sum -c -
          unzip -q zap.zip -d "$RUNNER_TEMP"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: ZAP passive baseline (no active scan)
        run: python bench/web/run_zap.py --require --zap "$RUNNER_TEMP/ZAP_2.17.0" -o zap-results.json --keep zap-raw
      - name: Kashif on the same corpus
        run: python bench/web/run_kashif.py -o web-results.json
      - name: Comparison
        run: >-
          python bench/web/score.py web-results.json --zap zap-results.json
          --baseline bench/web/results/1.0.2-legacy.json --markdown web-vs-zap.md
      - name: Comparison in the job summary
        if: always()
        run: test -f web-vs-zap.md && cat web-vs-zap.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: web-vs-zap
          path: |
            zap-results.json
            web-results.json
            web-vs-zap.md
            zap-raw/
          if-no-files-found: ignore
