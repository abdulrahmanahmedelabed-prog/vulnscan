name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "انشر النسخ في إصدار بهذا الوسم (اتركه فارغًا لبناء دون نشر)"
        type: string
        # empty by default: a manual run only builds and tests; it publishes only when a tag is typed here
        default: ""

# Read-only by default; only the publish job may write the release and sign provenance.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: dist/vulnscan.exe
            artifact: vulnscan-windows.exe
          # Ubuntu 22.04 (glibc 2.35) so the binary also runs on older distributions
          # (Debian 12, RHEL/Rocky 9, Ubuntu 22.04+), not only on the newest.
          - os: ubuntu-22.04
            built: dist/vulnscan
            artifact: vulnscan-linux
          # macOS: Apple Silicon natively, Intel by running the x86-64 slice of Python under Rosetta.
          # PyInstaller ad-hoc signs the binary (required on arm64). Apple notarization needs the owner's
          # Developer ID certificate, so these binaries are not notarized (see README for first launch).
          - os: macos-latest
            built: dist/vulnscan
            artifact: vulnscan-macos-arm64
            arch: arm64
          - os: macos-latest
            built: dist/vulnscan
            artifact: vulnscan-macos-x86_64
            arch: x64
            # the x64 Python on this runner is universal: force its x86-64 slice so PyInstaller builds for Intel
            run_as: arch -x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch || '' }}
      - run: ${{ matrix.run_as }} python -m pip install pyinstaller==6.22.3
      - run: ${{ matrix.run_as }} python -m PyInstaller --clean --noconfirm vulnscan.spec
      - name: Smoke test — CLI (version, rules, a scan with SARIF and a baseline)
        shell: bash
        run: |
          set -e
          B="${{ matrix.built }}"
          "$B" --version
          "$B" --list-rules > /dev/null
          mkdir -p smoke && printf 'import os\ndef f(request):\n    os.system(request.GET["c"])\n' > smoke/app.py
          "$B" smoke --no-deps --no-external -f sarif -o smoke.sarif
          grep -q '"ruleId": "DF' smoke.sarif
          "$B" smoke --no-deps --no-external --write-baseline smoke-base.json
          "$B" smoke --no-deps --no-external --baseline smoke-base.json --fail-on low
      - name: Smoke test — UI (the binary serves the dashboard, then stops)
        shell: bash
        run: |
          "${{ matrix.built }}" ui --no-browser --port 8799 &
          PID=$!
          OK=
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8799/ 2>/dev/null | grep -q "vulnscan"; then
              curl -fsS http://127.0.0.1:8799/styles.css > /dev/null && OK=1 && break
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          test "$OK" = 1
      - name: Check the binary's CPU architecture (macOS)
        if: runner.os == 'macOS'
        run: |
          file dist/vulnscan
          case "${{ matrix.arch }}" in
            arm64) file dist/vulnscan | grep -q arm64 ;;
            x64)   file dist/vulnscan | grep -q x86_64 ;;
          esac
      - name: Build the Windows setup wizard (kashif-setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { exit 1 } }
          $ver = if ($env:TAG -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { "0.0.0" }
          & $iscc "/DAppVersion=$ver" "/DSourceExe=$PWD\dist\vulnscan.exe" "/O$PWD" packaging\windows\kashif.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Smoke test — setup wizard (silent install to a chosen folder, run, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Kashif Test"
          $p = Start-Process -Wait -PassThru .\kashif-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CURRENTUSER","/DIR=`"$dir`"","/TASKS=addtopath"
          if ($p.ExitCode -ne 0) { throw "setup exited with $($p.ExitCode)" }
          & "$dir\kashif.exe" --version; if ($LASTEXITCODE -ne 0) { exit 1 }
          cmd /c "`"$dir\vulnscan.cmd`" --version"; if ($LASTEXITCODE -ne 0) { exit 1 }
          $path = [Environment]::GetEnvironmentVariable("Path", "User")
          if (-not (($path -split ';') -contains $dir)) { throw "the install folder was not added to PATH" }
          $p = Start-Process -Wait -PassThru "$dir\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          if ($p.ExitCode -ne 0) { throw "uninstall exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\kashif.exe") { throw "uninstall left kashif.exe behind" }
          $path = [Environment]::GetEnvironmentVariable("Path", "User")
          if (($path -split ';') -contains $dir) { throw "uninstall left the folder on PATH" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: kashif-setup.exe
          path: kashif-setup.exe
      - name: Name the binary per platform
        shell: bash
        run: |
          cp "${{ matrix.built }}" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    # One job publishes every binary after all builds succeed, so the release never
    # carries one platform without the others and the prune step cannot race a build.
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and upload assets
      id-token: write        # sign build provenance (Sigstore, keyless)
      attestations: write    # store the provenance attestation on GitHub
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          chmod +x vulnscan-linux vulnscan-macos-arm64 vulnscan-macos-x86_64
          sha256sum kashif-setup.exe vulnscan-windows.exe vulnscan-linux vulnscan-macos-arm64 vulnscan-macos-x86_64 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: SBOM (CycloneDX) of the source and its bundled components
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: out/vulnscan-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Signed SLSA build provenance for every binary
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            out/kashif-setup.exe
            out/vulnscan-windows.exe
            out/vulnscan-linux
            out/vulnscan-macos-arm64
            out/vulnscan-macos-x86_64
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            out/kashif-setup.exe
            out/vulnscan-windows.exe
            out/vulnscan-linux
            out/vulnscan-macos-arm64
            out/vulnscan-macos-x86_64
            out/SHA256SUMS.txt
            out/vulnscan-sbom.cdx.json
          body_path: CHANGELOG.md
          make_latest: true
          fail_on_unmatched_files: true
      - name: Prune stray release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          keep=" kashif-setup.exe vulnscan-windows.exe vulnscan-linux vulnscan-macos-arm64 vulnscan-macos-x86_64 SHA256SUMS.txt vulnscan-sbom.cdx.json "
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            case "$keep" in
              *" $name "*) ;;
              *) echo "removing stray asset: $name"; gh release delete-asset "$TAG" "$name" -y --repo "$GITHUB_REPOSITORY" || true ;;
            esac
          done

  vscode-extension:
    # The VS Code extension (a thin client of `vulnscan lsp`, see editors/), packaged as a .vsix on every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Build and package the extension
        working-directory: editors/vscode
        run: |
          npm ci --no-audit --no-fund
          npm run compile
          npm run package -- -o kashif-vscode.vsix
          unzip -l kashif-vscode.vsix | grep -q "extension/dist/extension.js"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kashif-vscode.vsix
          path: editors/vscode/kashif-vscode.vsix

  publish-vscode-extension:
    # Runs after `publish` (whose prune step keeps only the binaries it uploads) and adds the .vsix to the same release.
    needs: [publish, vscode-extension]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # upload the release asset
      id-token: write        # sign build provenance (Sigstore, keyless)
      attestations: write    # store the provenance attestation on GitHub
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kashif-vscode.vsix
          path: out
      - name: Signed SLSA build provenance for the extension
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: out/kashif-vscode.vsix
      - name: Attach the extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/kashif-vscode.vsix --clobber --repo "$GITHUB_REPOSITORY"
      # Store publishing needs the owner's tokens (repository secrets VSCE_PAT and OVSX_PAT, see
      # editors/README.md). Without them these steps are skipped and the .vsix stays attached to the release.
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3.2.1 publish --packagePath out/kashif-vscode.vsix
      - name: Publish to Open VSX (VSCodium, Cursor, Gitpod, Eclipse Theia)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0.10.1 publish out/kashif-vscode.vsix --pat "$OVSX_PAT"

  homebrew-formula:
    # Point Formula/kashif.rb (brew tap kashif/vulnscan <repo>; brew install kashif) at the release just published.
    needs: publish
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # commit the updated formula to the default branch
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Regenerate the formula from the release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP" --repo "$GITHUB_REPOSITORY"
          python3 packaging/update_formula.py "$TAG" "$RUNNER_TEMP/SHA256SUMS.txt"
      - name: Commit if it changed
        run: |
          if git diff --quiet -- Formula/kashif.rb; then echo "formula already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/kashif.rb
          git commit -m "Homebrew formula: $TAG"
          git push
