name: Build Windows executable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "انشر النسخة في إصدار بهذا الوسم (اتركه فارغًا لبناء دون نشر)"
        type: string
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --clean --noconfirm vulnscan.spec
      - name: Smoke test (the binary starts, serves the UI, then stops)
        shell: bash
        run: |
          dist/vulnscan.exe ui --no-browser --port 8799 &
          PID=$!
          OK=
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8799/ 2>/dev/null | grep -q "vulnscan"; then
              curl -fsS http://127.0.0.1:8799/styles.css > /dev/null && OK=1 && break
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          test "$OK" = 1
      - name: Name the binary
        shell: bash
        run: cp dist/vulnscan.exe vulnscan-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: vulnscan-windows.exe
          path: vulnscan-windows.exe
      - name: Publish to release
        # On a tag push, or on a manual run when a tag name is given, create/update
        # the release and attach the Windows binary. softprops/action-gh-release
        # creates the tag from the current commit when it does not yet exist.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: vulnscan-windows.exe
          fail_on_unmatched_files: true

      - name: Prune other release assets
        # Keep only the Windows binary; remove anything left from earlier runs
        # (old macOS/Linux builds or mis-named assets).
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            if [ "$name" != "vulnscan-windows.exe" ]; then
              echo "removing asset: $name"; gh release delete-asset "$TAG" "$name" -y --repo "$GITHUB_REPOSITORY" || true
            fi
          done
