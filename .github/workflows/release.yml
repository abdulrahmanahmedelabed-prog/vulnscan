name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "انشر النسخ في إصدار بهذا الوسم (اتركه فارغًا لبناء دون نشر)"
        type: string
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: vulnscan-windows.exe
            built: dist/vulnscan.exe
          - os: macos-latest
            artifact: vulnscan-macos
            built: dist/vulnscan
          - os: ubuntu-latest
            artifact: vulnscan-linux
            built: dist/vulnscan
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --clean --noconfirm vulnscan.spec
      - name: Smoke test (the binary starts, serves the UI, then stops)
        shell: bash
        run: |
          "${{ matrix.built }}" ui --no-browser --port 8799 &
          PID=$!
          OK=
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8799/ 2>/dev/null | grep -q "vulnscan"; then
              curl -fsS http://127.0.0.1:8799/styles.css > /dev/null && OK=1 && break
            fi
            sleep 1
          done
          kill $PID 2>/dev/null || true
          test "$OK" = 1
      - name: Name the binary per platform
        shell: bash
        run: cp "${{ matrix.built }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
      - name: Publish to release
        # On a tag push, or on a manual run when a tag name is given, create/update
        # the release and attach this platform's binary. softprops/action-gh-release
        # creates the tag from the current commit when it does not yet exist.
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true

      - name: Prune stray release assets
        # Keep only the three platform binaries; remove anything left from an
        # earlier run (e.g. a mis-named asset). Runs once, on the Linux job.
        if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          keep=" vulnscan-linux vulnscan-macos vulnscan-windows.exe "
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            case "$keep" in
              *" $name "*) ;;
              *) echo "removing stray asset: $name"; gh release delete-asset "$TAG" "$name" -y --repo "$GITHUB_REPOSITORY" || true ;;
            esac
          done
