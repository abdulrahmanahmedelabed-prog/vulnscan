name: Installers

# Real-machine tests of the one-line installers and the Homebrew formula, against a published release.
on:
  push:
    paths: ["site/install.sh", "site/install.ps1", "Formula/**", "packaging/**", ".github/workflows/installers.yml"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  install-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install.sh installs a verified binary
        shell: bash
        env:
          KASHIF_INSTALL_DIR: ${{ runner.temp }}/kashif-bin
        run: |
          sh site/install.sh
          "$KASHIF_INSTALL_DIR/kashif" --version
          "$KASHIF_INSTALL_DIR/vulnscan" --version          # the pre-rename name stays as an alias
          test -f "$KASHIF_INSTALL_DIR/kashif" && test ! -L "$KASHIF_INSTALL_DIR/kashif"
          test -L "$KASHIF_INSTALL_DIR/vulnscan"
          if [ "$(uname -s)" = Darwin ]; then
            # curl sets no quarantine attribute, so Gatekeeper will not block the binary
            ! xattr -p com.apple.quarantine "$KASHIF_INSTALL_DIR/kashif" 2>/dev/null
          fi
      - name: install.sh falls back to the legacy asset name for a release made before the rename
        shell: bash
        env:
          KASHIF_INSTALL_DIR: ${{ runner.temp }}/kashif-old
          KASHIF_VERSION: v0.9.0
        run: |
          sh site/install.sh
          "$KASHIF_INSTALL_DIR/kashif" --version
          "$KASHIF_INSTALL_DIR/vulnscan" --version
      - name: install.sh with a relative install folder leaves a working vulnscan alias
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          KASHIF_INSTALL_DIR=kashif-rel sh "$GITHUB_WORKSPACE/site/install.sh"
          cd /
          "$RUNNER_TEMP/kashif-rel/vulnscan" --version          # 1.0.0 made it a dangling link to "kashif-rel/kashif"
      - name: install.sh refuses a version that does not exist
        shell: bash
        env:
          KASHIF_INSTALL_DIR: ${{ runner.temp }}/kashif-bad
          KASHIF_VERSION: v0.0.1
        run: |
          if sh site/install.sh; then echo "expected a failure"; exit 1; fi
          test ! -e "$KASHIF_INSTALL_DIR/kashif" && test ! -e "$KASHIF_INSTALL_DIR/vulnscan"

  install-ps1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install.ps1 installs a verified binary
        shell: pwsh
        env:
          KASHIF_INSTALL_DIR: ${{ runner.temp }}\kashif-bin
        run: |
          ./site/install.ps1
          & "$env:KASHIF_INSTALL_DIR\kashif.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # the pre-rename name stays as an alias (a .cmd shim, like the setup wizard's)
          cmd /c "`"$env:KASHIF_INSTALL_DIR\vulnscan.cmd`" --version"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: install.ps1 reinstalls while kashif.exe is running (kashif ui)
        shell: pwsh
        env:
          KASHIF_INSTALL_DIR: ${{ runner.temp }}\kashif-bin
        run: |
          $exe = "$env:KASHIF_INSTALL_DIR\kashif.exe"
          $ui = Start-Process -FilePath $exe -ArgumentList "ui", "--no-browser", "--port", "8797" -PassThru -WindowStyle Hidden
          try {
            $up = $false
            foreach ($i in 1..40) {
              try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8797/ -TimeoutSec 2 | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $up) { throw "kashif ui did not start" }
            # 1.0.1 failed here: Copy-Item cannot overwrite a running .exe
            ./site/install.ps1
            & $exe --version; if ($LASTEXITCODE -ne 0) { exit 1 }
            if ($ui.HasExited) { throw "the running kashif ui was stopped by the install" }
            # once more while the renamed copy (kashif.exe.old) is still running: a uniquely named copy is used
            ./site/install.ps1
            & $exe --version; if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          finally {
            # the one-file binary runs as two processes (the bootloader and its child): stop the whole tree
            taskkill /PID $ui.Id /T /F | Out-Null
            $ui.WaitForExit(30000) | Out-Null
          }
          Start-Sleep -Seconds 2
          # with nothing running, the next install removes every leftover copy
          ./site/install.ps1
          $left = @(Get-ChildItem -LiteralPath $env:KASHIF_INSTALL_DIR -Filter "kashif.exe*" -File | Where-Object { $_.Name -ne "kashif.exe" })
          if ($left.Count -ne 0) { throw "leftovers: $($left.Name -join ', ')" }
      - name: install.ps1 works with an unset, empty or messy user PATH
        shell: pwsh
        env:
          KASHIF_INSTALL_DIR: ${{ runner.temp }}\kashif-path
        run: |
          $saved = [Environment]::GetEnvironmentVariable("Path", "User")
          function Get-UserPath { [Environment]::GetEnvironmentVariable("Path", "User") }
          try {
            $dir = $env:KASHIF_INSTALL_DIR
            # unset: GetEnvironmentVariable returns $null (1.0.0 failed here with "$userPath.TrimEnd")
            [Environment]::SetEnvironmentVariable("Path", $null, "User")
            ./site/install.ps1
            if ((Get-UserPath) -ne $dir) { throw "unset PATH: got '$(Get-UserPath)'" }
            # empty entries and a trailing ';' are dropped when the folder is appended
            [Environment]::SetEnvironmentVariable("Path", "C:\kashif-test-a;;C:\kashif-test-b;", "User")
            ./site/install.ps1
            if ((Get-UserPath) -ne "C:\kashif-test-a;C:\kashif-test-b;$dir") { throw "messy PATH: got '$(Get-UserPath)'" }
            # already there in another letter case and with a trailing '\': the PATH is left exactly as it was
            $same = "C:\kashif-test-a;$($dir.ToUpperInvariant())\;"
            [Environment]::SetEnvironmentVariable("Path", $same, "User")
            ./site/install.ps1
            if ((Get-UserPath) -ne $same) { throw "duplicate added: got '$(Get-UserPath)'" }
          }
          finally {
            [Environment]::SetEnvironmentVariable("Path", $saved, "User")
          }
      - name: install.ps1 falls back to the legacy asset name for a release made before the rename
        shell: pwsh
        env:
          KASHIF_INSTALL_DIR: ${{ runner.temp }}\kashif-old
          KASHIF_VERSION: v0.9.0
        run: |
          ./site/install.ps1
          $v = & "$env:KASHIF_INSTALL_DIR\kashif.exe" --version
          if ($LASTEXITCODE -ne 0 -or "$v" -notmatch '\b0\.9\.0\b') { throw "unexpected version: $v" }
          cmd /c "`"$env:KASHIF_INSTALL_DIR\vulnscan.cmd`" --version"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: install.ps1 upgrades a 0.9.x layout and removes its stale vulnscan.exe
        shell: pwsh
        env:
          KASHIF_INSTALL_DIR: ${{ runner.temp }}\kashif-old
        run: |
          # a 0.9.x install.ps1 put a full copy at vulnscan.exe (and its updater a vulnscan.exe.old next to it)
          Copy-Item "$env:KASHIF_INSTALL_DIR\kashif.exe" "$env:KASHIF_INSTALL_DIR\vulnscan.exe"
          Copy-Item "$env:KASHIF_INSTALL_DIR\kashif.exe" "$env:KASHIF_INSTALL_DIR\vulnscan.exe.old"
          ./site/install.ps1
          foreach ($name in "vulnscan.exe", "vulnscan.exe.old") {
            if (Test-Path "$env:KASHIF_INSTALL_DIR\$name") { throw "$name was not removed" }
          }
          $v = & "$env:KASHIF_INSTALL_DIR\kashif.exe" --version
          if ($LASTEXITCODE -ne 0 -or "$v" -match '\b0\.9\.0\b') { throw "not upgraded: $v" }
          $alias = cmd /c "`"$env:KASHIF_INSTALL_DIR\vulnscan.cmd`" --version"
          if ($LASTEXITCODE -ne 0 -or "$alias" -ne "$v") { throw "vulnscan alias reports '$alias', kashif '$v'" }
      - name: install.ps1 refuses a version that does not exist
        shell: pwsh
        env:
          KASHIF_INSTALL_DIR: ${{ runner.temp }}\kashif-bad
          KASHIF_VERSION: v0.0.1
        run: |
          $failed = $false
          try { ./site/install.ps1 } catch { $failed = $true }
          if (-not $failed) { throw "expected a failure" }
          if (Test-Path "$env:KASHIF_INSTALL_DIR\kashif.exe") { throw "something was installed" }

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: brew installs the formula from this repository
        shell: bash
        run: |
          brew tap-new --no-git kashif/local
          cp Formula/kashif.rb "$(brew --repository)/Library/Taps/kashif/homebrew-local/Formula/kashif.rb"
          brew install kashif/local/kashif
          kashif --version
          vulnscan --version          # the pre-rename name stays as an alias
          brew test kashif/local/kashif
          ! xattr -p com.apple.quarantine "$(brew --prefix)/bin/kashif" 2>/dev/null
