name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: python -m pytest -q
      # Self-scan: the tool must stay clean of high/critical findings.
      - run: vulnscan . --no-deps --no-external --no-color --exclude "tests/*" --fail-on high
