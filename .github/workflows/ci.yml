name: CI

on:
  push:
  pull_request:

# A newer push to the same branch supersedes a CI run that is still queued or running there, so its macOS jobs give
# their runners back (the account runs only a few macOS jobs at a time; 1.3.1's installers jobs waited ~30 min for one
# and failed). Never on main, never across branches or events: each pull request and each branch keeps its own group.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: jobs get read-only access unless they ask for more.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120   # py3.10 + coverage on macOS/Windows runners takes ~75 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - name: Lint
        run: ruff check vulnscan tests bench
      - name: Tests with coverage gate
        # a test stuck for 5 minutes dumps every thread's stack into the log instead of hanging the job silently
        run: python -m pytest -q --cov=vulnscan --cov-fail-under=75 -o faulthandler_timeout=300

  self-scan:
    # kashif scans its own source: it must stay free of high/critical findings, and the
    # results are published to GitHub Code Scanning (Security tab) as SARIF.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Both command names are installed (kashif, and vulnscan as an alias)
        run: kashif --version && vulnscan --version
      - name: Scan (SARIF)
        run: kashif . --no-deps --no-external --exclude "tests/*" --exclude "bench/*" --exclude "vulnscan/data/web/*" --exclude "tools/screenshots/*" -f sarif -o vulnscan.sarif
      - name: Upload to Code Scanning
        if: github.event_name == 'push'
        continue-on-error: true   # private repositories without code scanning cannot accept uploads
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: vulnscan.sarif
          category: vulnscan-self-scan
      - name: Gate on high / critical
        run: vulnscan . --no-deps --no-external --no-color --exclude "tests/*" --exclude "bench/*" --exclude "vulnscan/data/web/*" --exclude "tools/screenshots/*" --fail-on high

  benchmark:
    # Accuracy regression gate on the OWASP Benchmark for Python (https://owasp.org/www-project-benchmark/).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e .
      - run: git clone --depth 1 https://github.com/OWASP-Benchmark/BenchmarkPython.git /tmp/bp
      - name: Score (fails below the recorded floor)
        run: python bench/score_owasp.py /tmp/bp --json owasp.json --min-score "$(cat bench/min-score-python.txt)"
