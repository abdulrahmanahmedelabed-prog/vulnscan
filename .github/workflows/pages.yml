name: Deploy landing page

on:
  push:
    branches: [main]
    paths: ["site/**", "vulnscan/__init__.py", ".github/workflows/pages.yml",
            "README.md", "CHANGELOG.md", "SECURITY.md", "LICENSE", "PRIVACY.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stamp the current version into the page
        run: python3 site/stamp_version.py site/index.html
      - name: Build the documentation pages from README, CHANGELOG, SECURITY and LICENSE
        run: python3 site/build_docs.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
