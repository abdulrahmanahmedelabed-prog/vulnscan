[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "0.6.1"
description = "Standalone source-code vulnerability scanner that reports findings from highest to lowest severity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vulnscan = "vulnscan.cli:main"

[tool.setuptools.packages.find]
include = ["vulnscan*"]

[tool.setuptools.package-data]
vulnscan = ["ui/*", "models/*", "queries/*"]
