[build-system]
requires = ["setuptools>=77"]   # SPDX `license` expression (PEP 639)
build-backend = "setuptools.build_meta"

[project]
# The distribution is "kashif" (PyPI's "vulnscan" is an unrelated project); the import package stays `vulnscan` and
# both commands, kashif and vulnscan, are installed. Up to 1.0.1 the distribution was called "vulnscan" (git installs):
# `pip uninstall vulnscan` first, see vulnscan/updater.py install_info() and docs/publishing.md.
name = "kashif"
version = "1.0.2"
description = "Standalone source-code vulnerability scanner that reports findings from highest to lowest severity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "security", "sast", "static-analysis", "vulnerability-scanner", "sarif", "taint-analysis", "data-flow-analysis",
    "code-scanning", "secure-code-review", "devsecops", "appsec", "owasp", "cwe", "secrets-detection", "lsp",
    "oracle-apex",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
kashif = "vulnscan.cli:main"
vulnscan = "vulnscan.cli:main"   # the pre-rename command name, kept as an alias

[project.urls]
Homepage = "https://abdulrahmanahmedelabed-prog.github.io/vulnscan/"
Documentation = "https://abdulrahmanahmedelabed-prog.github.io/vulnscan/docs.html"
Changelog = "https://abdulrahmanahmedelabed-prog.github.io/vulnscan/changelog.html"
Security = "https://abdulrahmanahmedelabed-prog.github.io/vulnscan/security.html"
Repository = "https://github.com/abdulrahmanahmedelabed-prog/vulnscan"
Issues = "https://github.com/abdulrahmanahmedelabed-prog/vulnscan/issues"

[tool.ruff]
line-length = 130
extend-exclude = ["tests/data"]   # intentionally vulnerable sample programs
target-version = "py310"

[tool.ruff.lint]
# correctness-focused set: syntax errors, undefined names, unused code, mutable defaults
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B006", "B008"]

[tool.coverage.run]
omit = ["vulnscan/__main__.py"]

[tool.setuptools.packages.find]
include = ["vulnscan*"]

[tool.setuptools.package-data]
vulnscan = ["ui/*", "models/*", "queries/*", "data/*", "data/web/*"]   # data/web: web scanner snapshots (1.1.0)
