[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscan"
version = "0.9.0"
description = "Standalone source-code vulnerability scanner that reports findings from highest to lowest severity."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["security", "sast", "static-analysis", "vulnerability-scanner", "sarif", "taint-analysis", "oracle-apex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
vulnscan = "vulnscan.cli:main"

[project.urls]
Homepage = "https://abdulrahmanahmedelabed-prog.github.io/vulnscan/"
Source = "https://github.com/abdulrahmanahmedelabed-prog/vulnscan"
Issues = "https://github.com/abdulrahmanahmedelabed-prog/vulnscan/issues"
Changelog = "https://github.com/abdulrahmanahmedelabed-prog/vulnscan/blob/main/CHANGELOG.md"
Security = "https://github.com/abdulrahmanahmedelabed-prog/vulnscan/security/policy"

[tool.ruff]
line-length = 130
extend-exclude = ["tests/data"]   # intentionally vulnerable sample programs
target-version = "py310"

[tool.ruff.lint]
# correctness-focused set: syntax errors, undefined names, unused code, mutable defaults
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B006", "B008"]

[tool.coverage.run]
omit = ["vulnscan/__main__.py"]

[tool.setuptools.packages.find]
include = ["vulnscan*"]

[tool.setuptools.package-data]
vulnscan = ["ui/*", "models/*", "queries/*"]
